[build-system]
requires=["setuptools>=77","wheel>=0.43"]
build-backend="setuptools.build_meta"
[project]
name="cloud-files-sdk"
version="1.0.0"
description="Windows x64 Cloud-Files-SDK direct SDK"
requires-python=">=3.10"
license="MIT"
readme="README.md"
[project.urls]
Repository="https://github.com/titanfyre/Cloud-Files-SDK"
[tool.setuptools]
packages=["cloud_files_sdk"]
[tool.setuptools.package-data]
cloud_files_sdk=["*.dll"]
[tool.setuptools.data-files]
"share/cloud-files-sdk/docs"=["docs/*","LICENSE"]
